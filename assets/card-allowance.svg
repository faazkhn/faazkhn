<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="Allowance: PayPal AI Hackathon. AI buying agents for a team: they find the deal and pay with PayPal, while code, not the model, enforces the budget.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3d9be9" stop-opacity=".32"/><stop offset=".6" stop-color="#3d9be9" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#3d9be9" stop-opacity="0"/><stop offset=".5" stop-color="#3d9be9"/><stop offset="1" stop-color="#3d9be9" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3d9be9; letter-spacing: .5px; }
  .d { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c3ccda; }
  .chip { fill: #3d9be9; fill-opacity: .12; stroke: #3d9be9; stroke-opacity: .4; }
  .ct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .sheen { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { from { transform: translateX(-590px); } to { transform: translateX(590px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="590" height="250" fill="#0a0e17"/>
  <rect width="590" height="250" fill="url(#glow)"/>
  <rect class="sheen" y="0" width="590" height="3" fill="url(#sheen)"/>
  <circle class="pulse" cx="556" cy="34" r="6" fill="#3d9be9"/>
  <text x="28" y="52" class="b">PAYPAL AI HACKATHON</text>
  <text x="28" y="88" class="t">Allowance</text>
  <text x="28" y="118" class="d">AI buying agents for a team: they find the deal and pay</text><text x="28" y="142" class="d">with PayPal, while code, not the model, enforces the</text><text x="28" y="166" class="d">budget.</text>
  <g transform="translate(28 198)"><rect width="67" height="26" rx="13" class="chip"/><text x="34" y="17.5" text-anchor="middle" class="ct">Next.js</text></g><g transform="translate(103 198)"><rect width="104" height="26" rx="13" class="chip"/><text x="52" y="17.5" text-anchor="middle" class="ct">PayPal Vault</text></g><g transform="translate(215 198)"><rect width="60" height="26" rx="13" class="chip"/><text x="30" y="17.5" text-anchor="middle" class="ct">Gemini</text></g><g transform="translate(282 198)"><rect width="38" height="26" rx="13" class="chip"/><text x="19" y="17.5" text-anchor="middle" class="ct">Zod</text></g>
  <rect x=".5" y=".5" width="589" height="249" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>
