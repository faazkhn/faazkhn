<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="Hivemind: Codex × TwitchCon Hackathon. Turns a Twitch chat too fast to read into one live AI character that speaks for the whole crowd.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#b388ff" stop-opacity=".32"/><stop offset=".6" stop-color="#b388ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#b388ff" stop-opacity="0"/><stop offset=".5" stop-color="#b388ff"/><stop offset="1" stop-color="#b388ff" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #b388ff; letter-spacing: .5px; }
  .d { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c3ccda; }
  .chip { fill: #b388ff; fill-opacity: .12; stroke: #b388ff; stroke-opacity: .4; }
  .ct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .sheen { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { from { transform: translateX(-590px); } to { transform: translateX(590px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="590" height="250" fill="#0a0e17"/>
  <rect width="590" height="250" fill="url(#glow)"/>
  <rect class="sheen" y="0" width="590" height="3" fill="url(#sheen)"/>
  <circle class="pulse" cx="556" cy="34" r="6" fill="#b388ff"/>
  <text x="28" y="52" class="b">CODEX × TWITCHCON HACKATHON</text>
  <text x="28" y="88" class="t">Hivemind</text>
  <text x="28" y="118" class="d">Turns a Twitch chat too fast to read into one live AI</text><text x="28" y="142" class="d">character that speaks for the whole crowd.</text>
  <g transform="translate(28 198)"><rect width="89" height="26" rx="13" class="chip"/><text x="44" y="17.5" text-anchor="middle" class="ct">TypeScript</text></g><g transform="translate(125 198)"><rect width="74" height="26" rx="13" class="chip"/><text x="37" y="17.5" text-anchor="middle" class="ct">EventSub</text></g><g transform="translate(207 198)"><rect width="89" height="26" rx="13" class="chip"/><text x="44" y="17.5" text-anchor="middle" class="ct">Embeddings</text></g><g transform="translate(304 198)"><rect width="38" height="26" rx="13" class="chip"/><text x="19" y="17.5" text-anchor="middle" class="ct">OBS</text></g>
  <rect x=".5" y=".5" width="589" height="249" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>
