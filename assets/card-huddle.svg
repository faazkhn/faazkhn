<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="Huddle: Amazon Developer Hackathon. A Fire TV party game where every phone becomes the TV&#x27;s camera and on-device pose estimation scores your form.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff9900" stop-opacity=".32"/><stop offset=".6" stop-color="#ff9900" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#ff9900" stop-opacity="0"/><stop offset=".5" stop-color="#ff9900"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #ff9900; letter-spacing: .5px; }
  .d { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c3ccda; }
  .chip { fill: #ff9900; fill-opacity: .12; stroke: #ff9900; stroke-opacity: .4; }
  .ct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .sheen { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { from { transform: translateX(-590px); } to { transform: translateX(590px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="590" height="250" fill="#0a0e17"/>
  <rect width="590" height="250" fill="url(#glow)"/>
  <rect class="sheen" y="0" width="590" height="3" fill="url(#sheen)"/>
  <circle class="pulse" cx="556" cy="34" r="6" fill="#ff9900"/>
  <text x="28" y="52" class="b">AMAZON DEVELOPER HACKATHON</text>
  <text x="28" y="88" class="t">Huddle</text>
  <text x="28" y="118" class="d">A Fire TV party game where every phone becomes the TV&#x27;s</text><text x="28" y="142" class="d">camera and on-device pose estimation scores your form.</text>
  <g transform="translate(28 198)"><rect width="67" height="26" rx="13" class="chip"/><text x="34" y="17.5" text-anchor="middle" class="ct">Fire TV</text></g><g transform="translate(103 198)"><rect width="118" height="26" rx="13" class="chip"/><text x="59" y="17.5" text-anchor="middle" class="ct">MediaPipe Pose</text></g><g transform="translate(229 198)"><rect width="67" height="26" rx="13" class="chip"/><text x="34" y="17.5" text-anchor="middle" class="ct">Bedrock</text></g><g transform="translate(304 198)"><rect width="89" height="26" rx="13" class="chip"/><text x="44" y="17.5" text-anchor="middle" class="ct">WebSockets</text></g>
  <rect x=".5" y=".5" width="589" height="249" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>
