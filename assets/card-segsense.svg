<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="SegSense: Nebius × NVIDIA Global AI Hackathon. Hunts segfaults and leaks in C with AddressSanitizer, patches the bug and re-tests. Only sanitizer-clean fixes count.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#9be15d" stop-opacity=".32"/><stop offset=".6" stop-color="#9be15d" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#9be15d" stop-opacity="0"/><stop offset=".5" stop-color="#9be15d"/><stop offset="1" stop-color="#9be15d" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #9be15d; letter-spacing: .5px; }
  .d { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c3ccda; }
  .chip { fill: #9be15d; fill-opacity: .12; stroke: #9be15d; stroke-opacity: .4; }
  .ct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .sheen { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { from { transform: translateX(-590px); } to { transform: translateX(590px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="590" height="250" fill="#0a0e17"/>
  <rect width="590" height="250" fill="url(#glow)"/>
  <rect class="sheen" y="0" width="590" height="3" fill="url(#sheen)"/>
  <circle class="pulse" cx="556" cy="34" r="6" fill="#9be15d"/>
  <text x="28" y="52" class="b">NEBIUS × NVIDIA GLOBAL AI HACKATHON</text>
  <text x="28" y="88" class="t">SegSense</text>
  <text x="28" y="118" class="d">Hunts segfaults and leaks in C with AddressSanitizer,</text><text x="28" y="142" class="d">patches the bug and re-tests. Only sanitizer-clean fixes</text><text x="28" y="166" class="d">count.</text>
  <g transform="translate(28 198)"><rect width="23" height="26" rx="13" class="chip"/><text x="12" y="17.5" text-anchor="middle" class="ct">C</text></g><g transform="translate(59 198)"><rect width="133" height="26" rx="13" class="chip"/><text x="66" y="17.5" text-anchor="middle" class="ct">AddressSanitizer</text></g><g transform="translate(200 198)"><rect width="74" height="26" rx="13" class="chip"/><text x="37" y="17.5" text-anchor="middle" class="ct">Nemotron</text></g><g transform="translate(282 198)"><rect width="60" height="26" rx="13" class="chip"/><text x="30" y="17.5" text-anchor="middle" class="ct">Docker</text></g>
  <rect x=".5" y=".5" width="589" height="249" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>
