<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Rapport in numbers: 512-question blind benchmark; 0 jailbreak checks failed versus 6 for a prompt-only baseline; 1.8 s median to first word; fully on-device. Reworded risk-question recall on the test half: keyword tags 35.1%, deployed hybrid 72.7%, zero-shot 4B model 94.8%.">
<defs><linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#3fd6bd"/><stop offset="1" stop-color="#b388ff"/></linearGradient></defs>
<style>
  .tile { fill: #ffffff; fill-opacity: .045; stroke: #ffffff; stroke-opacity: .1; }
  .big { font: 800 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: url(#edge); }
  .lab { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .small { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b96a8; }
  .h { font: 800 26px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; } .hs { font: 400 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #8b96a8; }
  .k { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #3fd6bd; letter-spacing: 2.5px; }
  .blab { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; } .bval { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0a0e17; }
  .track { fill: #ffffff; fill-opacity: .06; }
  .bar { animation: grow 1.4s cubic-bezier(.2,.8,.2,1) both; transform-origin: 390px 0; }
  @keyframes grow { from { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="500" rx="24" fill="#0a0e17"/>
<rect x=".5" y=".5" width="1199" height="499" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
<text x="40" y="52" class="k">RAPPORT · IN NUMBERS</text>
<text x="40" y="86" class="h">Decide in code, voice with the model</text>
<g transform="translate(40 112)">
  <rect width="265" height="128" rx="16" class="tile"/>
  <text x="22" y="56" class="big">512</text>
  <text x="22" y="86" class="lab">blind benchmark questions</text>
  <text x="22" y="108" class="small">reworded, with a strict test split</text></g><g transform="translate(325 112)">
  <rect width="265" height="128" rx="16" class="tile"/>
  <text x="22" y="56" class="big">0 vs 6</text>
  <text x="22" y="86" class="lab">jailbreak checks failed</text>
  <text x="22" y="108" class="small">code-governed vs prompt-only</text></g><g transform="translate(610 112)">
  <rect width="265" height="128" rx="16" class="tile"/>
  <text x="22" y="56" class="big">1.8 s</text>
  <text x="22" y="86" class="lab">to the patient&#x27;s first word</text>
  <text x="22" y="108" class="small">median, all on one laptop</text></g><g transform="translate(895 112)">
  <rect width="265" height="128" rx="16" class="tile"/>
  <text x="22" y="56" class="big">0 bytes</text>
  <text x="22" y="86" class="lab">leave the device</text>
  <text x="22" y="108" class="small">no audio or text sent anywhere</text></g>
<text x="40" y="300" class="lab">Reworded suicide-risk questions recognised, held-out test half</text>
<text x="40" y="349" class="blab">Keyword tags</text>
<rect x="390" y="330" width="760" height="26" rx="13" class="track"/>
<rect x="390" y="330" width="266.8" height="26" rx="13" fill="#5b6b82" class="bar"/>
<text x="644.8" y="348" text-anchor="end" class="bval">35.1%</text><text x="40" y="401" class="blab">Hybrid: tags + 33M encoder (deployed)</text>
<rect x="390" y="382" width="760" height="26" rx="13" class="track"/>
<rect x="390" y="382" width="552.5" height="26" rx="13" fill="#3fd6bd" class="bar"/>
<text x="930.5" y="400" text-anchor="end" class="bval">72.7%</text><text x="40" y="453" class="blab">Same 4B model, zero-shot</text>
<rect x="390" y="434" width="760" height="26" rx="13" class="track"/>
<rect x="390" y="434" width="720.5" height="26" rx="13" fill="#b388ff" class="bar"/>
<text x="1098.5" y="452" text-anchor="end" class="bval">94.8%</text>
</svg>
