<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 250" width="590" height="250" role="img" aria-label="RideTaste: Qloo Agentic Hackathon. Tell it the films, music and food you and a friend love; it plans a bike ride with stops you&#x27;d both enjoy.">
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ff6b6b" stop-opacity=".32"/><stop offset=".6" stop-color="#ff6b6b" stop-opacity="0"/></radialGradient>
  <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#ff6b6b" stop-opacity="0"/><stop offset=".5" stop-color="#ff6b6b"/><stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/></linearGradient>
  <clipPath id="c"><rect width="590" height="250" rx="20"/></clipPath>
</defs>
<style>
  .t { font: 800 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .b { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #ff6b6b; letter-spacing: .5px; }
  .d { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c3ccda; }
  .chip { fill: #ff6b6b; fill-opacity: .12; stroke: #ff6b6b; stroke-opacity: .4; }
  .ct { font: 500 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e8edf5; }
  .sheen { animation: sweep 5s ease-in-out infinite; } @keyframes sweep { from { transform: translateX(-590px); } to { transform: translateX(590px); } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="590" height="250" fill="#0a0e17"/>
  <rect width="590" height="250" fill="url(#glow)"/>
  <rect class="sheen" y="0" width="590" height="3" fill="url(#sheen)"/>
  <circle class="pulse" cx="556" cy="34" r="6" fill="#ff6b6b"/>
  <text x="28" y="52" class="b">QLOO AGENTIC HACKATHON</text>
  <text x="28" y="88" class="t">RideTaste</text>
  <text x="28" y="118" class="d">Tell it the films, music and food you and a friend love;</text><text x="28" y="142" class="d">it plans a bike ride with stops you&#x27;d both enjoy.</text>
  <g transform="translate(28 198)"><rect width="111" height="26" rx="13" class="chip"/><text x="55" y="17.5" text-anchor="middle" class="ct">Qloo Taste AI</text></g><g transform="translate(147 198)"><rect width="133" height="26" rx="13" class="chip"/><text x="66" y="17.5" text-anchor="middle" class="ct">Function calling</text></g><g transform="translate(288 198)"><rect width="45" height="26" rx="13" class="chip"/><text x="23" y="17.5" text-anchor="middle" class="ct">OSRM</text></g><g transform="translate(341 198)"><rect width="67" height="26" rx="13" class="chip"/><text x="34" y="17.5" text-anchor="middle" class="ct">Leaflet</text></g>
  <rect x=".5" y=".5" width="589" height="249" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</g>
</svg>
