  @keyframes node { 0%,100% { transform: scale(1); fill: #0a0e17; } 50% { transform: scale(1.35); fill: #3fd6bd; } }
  .drift1 { animation: d1 14s ease-in-out infinite alternate; } .drift2 { animation: d2 17s ease-in-out infinite alternate; }
